# =============================================================================
# NullFlow v5c on Split-TinyImageNet: MLP Classifier + Herding buffer
# =============================================================================
# Same as v5c CIFAR-100 config but adapted for TinyImageNet (200 classes, 64×64)

benchmark: "split_tinyimagenet"
num_tasks: 10
classes_per_task: 20
image_size: 64
latent_dim: 512

# --- Encoder ---
encoder_type: "resnet"
use_raw_features: true

# --- Classifier --- MLP (same as v5c)
classifier_type: "mlp"
classifier_hidden_dim: 512
use_cosine_classifier: false

# --- Latent Replay Buffer — HERDING
buffer_per_class: 20
buffer_max_total: 5000
buffer_selection: "herding"

# --- Flow Matching (NREM) ---
ode_solver: "heun"
num_ode_steps: 6
fm_epochs_per_task: 50
fm_lr: 0.0005
fm_batch_size: 128

# --- Data ---
dataset_root: "data/"
normalize_mean: [0.4802, 0.4481, 0.3975]
normalize_std: [0.2770, 0.2691, 0.2821]

# --- Null-Space Projection — ACTIVE ---
nsp_rank: 200
nsp_alpha: 1.0

# --- Wake Phase ---
wake_epochs_per_task: 25
wake_lr: 0.001
wake_batch_size: 64
wake_replay_weight: 1.0
wake_kd_weight: 0.5
wake_replay_ratio: 3.0
wake_weight_decay: 0.0001
use_balanced_replay: false

# --- FM Augmentation — ACTIVE ---
fm_augment_wake: true
fm_samples_per_class: 50

# --- Sleep-REM ---
use_bft: false
rem_epochs: 35
rem_lr: 0.0004
rem_use_buffer: true
replay_per_class: 50
kd_temperature: 3.0
kd_weight: 1.5
ce_replay_weight: 1.5

# --- Regularisation ---
label_smoothing: 0.0
grad_clip_norm: 0.0

# --- Plasticity ---
latent_noise_std: 0.1
use_weight_align: true
use_proto_init: false

# --- Masking/NSP-wake --- DISABLED
use_train_masking: false
use_nsp_wake: false

# --- LR Scheduling ---
use_cosine_schedule: true

# --- Final Consolidation ---
final_consolidation_epochs: 0

# --- Output ---
output_dir: "results/split_tinyimagenet/"
