# =============================================================================
# ABLATION: FM Low-Ratio (50/class in both Wake + REM)
# =============================================================================
# KEY FIX: Reduce FM from 200 → 50 samples/class so synthetic stays ≤50%
# of the training signal. Buffer=20 real + 50 FM = ~71% synthetic in Wake,
# but in REM: 20 buffer + 50 FM = moderate ratio vs 200 FM that was 90%.

benchmark: "split_cifar100"
num_tasks: 10
classes_per_task: 10
image_size: 32
latent_dim: 512

# --- Encoder ---
encoder_type: "resnet"
use_raw_features: true

# --- Classifier ---
classifier_hidden_dim: 512
use_cosine_classifier: false

# --- Latent Replay Buffer (SMALL — realistic CL setting) ---
buffer_per_class: 20
buffer_max_total: 5000

# --- Flow Matching (NREM) ---
ode_solver: "heun"
num_ode_steps: 6
fm_epochs_per_task: 50
fm_lr: 0.0005
fm_batch_size: 128

# --- Data ---
dataset_root: "data/"
normalize_mean: [0.5071, 0.4867, 0.4408]
normalize_std: [0.2675, 0.2565, 0.2761]

# --- Null-Space Projection — DISABLED ---
nsp_rank: 100
nsp_alpha: 0.0

# --- Wake Phase ---
wake_epochs_per_task: 25
wake_lr: 0.001
wake_batch_size: 64
wake_replay_weight: 1.0
wake_kd_weight: 0.5
wake_replay_ratio: 3.0
wake_weight_decay: 0.0001
use_balanced_replay: false

# --- FM Augmentation — ACTIVE with reduced ratio ---
fm_augment_wake: true
fm_samples_per_class: 50      # <-- reduced from 200 to 50

# --- Sleep-REM (FM + buffer, but reduced FM) ---
use_bft: false
rem_epochs: 35
rem_lr: 0.0004
rem_use_buffer: true
replay_per_class: 50          # <-- reduced from 200 to 50
kd_temperature: 3.0
kd_weight: 1.5
ce_replay_weight: 1.5

# --- Regularisation ---
label_smoothing: 0.0
grad_clip_norm: 0.0

# --- Plasticity Improvements ---
latent_noise_std: 0.1
use_weight_align: true
use_proto_init: false

# --- LR Scheduling ---
use_cosine_schedule: true

# --- Final Consolidation ---
final_consolidation_epochs: 0

# --- Output ---
output_dir: "results/split_cifar100/"
